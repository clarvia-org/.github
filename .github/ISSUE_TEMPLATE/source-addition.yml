name: Source addition
description: Suggest an official source to add to the Clarvia source registry.
title: "[Source addition]: "
labels:
  - type: source
  - status: needs-source
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest official or authoritative sources.

        Good sources include government portals, official forms, statutes, regulations, administrative guidance, and institutional pages.

  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: Link to the official source.
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: source_title
    attributes:
      label: Source title
      description: Title of the source.
    validations:
      required: false

  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      description: Country, region, or institution.
      placeholder: "Example: Luxembourg"
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: Source language.
      placeholder: "Example: French"
    validations:
      required: true

  - type: textarea
    id: relevance
    attributes:
      label: Why is this source relevant?
      description: Explain which workflow, task, deadline, document requirement, or institution this source supports.
    validations:
      required: true

  - type: input
    id: access_date
    attributes:
      label: Access date
      description: Date you accessed the source, if known.
      placeholder: "YYYY-MM-DD"
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This is an official or authoritative source to the best of my knowledge.
          required: true
        - label: I have not included sensitive personal information.
          required: true
