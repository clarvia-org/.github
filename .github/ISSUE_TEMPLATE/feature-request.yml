name: Feature request
description: Suggest an improvement to Clarvia's workflows, website, exports, tooling, or documentation.
title: "[Feature]: "
labels:
  - type: feature
  - status: needs-review
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the improvement you would like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - workflow-data
        - workflow-web
        - documentation
        - accessibility
        - translation
        - validation/tooling
        - exports/API
        - governance/community
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included sensitive personal information.
          required: true
