name: Workflow correction
description: Report a possible error, outdated source, missing step, or unclear workflow item.
title: "[Workflow correction]: "
labels:
  - type: workflow
  - status: needs-review
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Clarvia.

        Do not include personal bereavement cases, identity documents, death certificates, addresses, or other sensitive personal information.

  - type: input
    id: jurisdiction
    attributes:
      label: Jurisdiction
      description: Which country, region, or cross-border corridor is affected?
      placeholder: "Example: Luxembourg"
    validations:
      required: true

  - type: input
    id: workflow
    attributes:
      label: Affected workflow or page
      description: Link or name of the affected workflow, checklist, or data object.
      placeholder: "Example: Luxembourg death declaration workflow"
    validations:
      required: false

  - type: textarea
    id: issue
    attributes:
      label: What seems incorrect or missing?
      description: Describe the possible issue.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Official source
      description: Provide the official source URL, legal provision, or administrative reference if known.
      placeholder: "Official source URL, title, language, access date, relevant section."
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How significant is this correction?
      options:
        - Broken link or metadata issue
        - Wording or clarity issue
        - Missing administrative step
        - Incorrect deadline
        - Incorrect requirement
        - Cross-border branching issue
        - Other
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included sensitive personal information.
          required: true
        - label: I understand Clarvia provides administrative guidance, not individualized legal advice.
          required: true
